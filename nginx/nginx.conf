user nginx;
worker_processes 1;

pid /var/run/nginx.pid;

events {
    worker_connections 128;
}

http {
    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr notice;

    keepalive_timeout 30s;
    client_max_body_size 64k;
    client_body_buffer_size 64k;

    upstream php_old_vulnerable {
        server php-pre-november-fix:9000;
        keepalive 1;
    }

    upstream php_new_patched {
        server php-november-fixed:9000;
        keepalive 1;
    }

    upstream php_old_mitigated {
        server php-old-mitigated:9000;
        keepalive 1;
    }

    server {
        listen 8080;

        location / {
            fastcgi_pass php_old_vulnerable;
            fastcgi_keep_conn on;
            fastcgi_next_upstream off;
            fastcgi_read_timeout 8s;
            fastcgi_buffering off;

            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/target.php;
            fastcgi_param SCRIPT_NAME $uri;
            fastcgi_param REMOTE_ADDR $remote_addr;
        }
    }

    server {
        listen 8081;

        location / {
            fastcgi_pass php_new_patched;
            fastcgi_keep_conn on;
            fastcgi_next_upstream off;
            fastcgi_read_timeout 8s;
            fastcgi_buffering off;

            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/target.php;
            fastcgi_param SCRIPT_NAME $uri;
            fastcgi_param REMOTE_ADDR $remote_addr;
        }
    }

    server {
        listen 8082;

        location / {
            fastcgi_pass php_old_mitigated;
            fastcgi_keep_conn off;
            fastcgi_next_upstream off;
            fastcgi_read_timeout 8s;
            fastcgi_buffering off;

            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/target.php;
            fastcgi_param SCRIPT_NAME $uri;
            fastcgi_param REMOTE_ADDR $remote_addr;
        }
    }
}
